name: folium

services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261019@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    ports: ["8081:8081"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000"]

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    volumes: ["./servicebus.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"]
    ports: ["5672:5672", "5300:5300"]
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set a local password for the emulator's SQL Server}
      ACCEPT_EULA: ${ACCEPT_EULA:?set Y to accept the Service Bus emulator and SQL Server licences}
    depends_on: [mssql]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set a local password for the emulator's SQL Server}
      ACCEPT_EULA: ${ACCEPT_EULA:?set Y to accept the Service Bus emulator and SQL Server licences}
